name: CD pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backendci.yml'
      - '.github/workflows/backendcd.yml'

  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backendci.yml'
      - '.github/workflows/backendcd.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: giouw1/dingdongbackend

jobs:
  ci-test:
    name: Executar Testes do CI
    uses: ./.github/workflows/backendci.yml

  build-and-push:
    name: Build e Push Docker (GHCR)
    needs: ci-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados para Docker (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: backend/
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Só envia a imagem se for o push final na main, nunca no PR
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na Oracle VM
    needs: build-and-push
    # Executa o deploy EXCLUSIVAMENTE quando o commit entrar de fato na main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            echo "${{ secrets.DEPLOY_GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            cd /mnt/volume/configs
            docker compose up -d
