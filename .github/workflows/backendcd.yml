name: CD pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backendci.yml'
      - '.github/workflows/backendcd.yml'

  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backendci.yml'
      - '.github/workflows/backendcd.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: giouw1/dingdongbackend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados para Docker (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: backend/
          file: ./backend/Dockerfile
          # Só envia a imagem se for o push final na main, nunca no PR
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



  deploy:
    needs: build-and-push
    # Executa o deploy EXCLUSIVAMENTE quando o commit entrar de fato na main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Sincronizar Frontend com Azure File Share
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage file upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
              --account-key "${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}" \
              --destination "sqlite-share/frontend" \
              --source "backend/frontend"
      - name: Deploy no Azure Container Instance
        uses: azure/aci-deploy@v1
        with:
          resource-group: dingdongbackend
          name: backend
          image: ghcr.io/${{ env.IMAGE_NAME }}:latest
          registry-login-server: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.DEPLOY_GHCR_TOKEN }}
          environment-variables: ${{vars}}
          location: 'chilecentral'
          dns-name-label: dingdong-backend-giou
          ports: 8000
          azure-file-volume-account-name: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          azure-file-volume-account-key: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          azure-file-volume-share-name: 'sqlite-share'
          azure-file-volume-mount-path: '/app/data'








