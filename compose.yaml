services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dingdong_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      - APP_ENV=development
      - SERVER_HOST=0.0.0.0
    volumes:
      - ./backend/data/databases:/app/data/databases
      - ./backend/data/frontend:/app/data/frontend:ro
      - ./backend/data/logging:/app/data/logging

volumes:
  sqlite_data:
    driver: local
